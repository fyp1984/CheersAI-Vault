services:
  vault-runtime-api:
    build:
      context: .
      dockerfile: apps/vault-runtime-api/Dockerfile
    container_name: cheersai-vault-runtime
    environment:
      VAULT_RUNTIME_PORT: 8787
      VAULT_RUNTIME_BIND_HOST: 0.0.0.0
      VAULT_RUNTIME_DATA_DIR: /var/lib/cheersai-vault/runtime-data
      VAULT_RUNTIME_CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:3000,http://localhost:3000,http://127.0.0.1:3001,http://localhost:3001
    ports:
      - "8787:8787"
    volumes:
      - vault_runtime_data:/var/lib/cheersai-vault/runtime-data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8787/api/v1/health').getcode()==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  vault-pro-web:
    build:
      context: .
      dockerfile: apps/vault-pro-web/Dockerfile
    container_name: cheersai-vault-web
    depends_on:
      vault-runtime-api:
        condition: service_healthy
    ports:
      - "5173:5173"

volumes:
  vault_runtime_data:
