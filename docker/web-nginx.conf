server {
  listen 5173;
  server_name _;

  # Keep the proxy upload ceiling aligned with the Runtime multipart contract.
  client_max_body_size 2048m;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://vault-runtime-api:8787;
    proxy_http_version 1.1;
    proxy_connect_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    error_page 404 = @runtime_404_suppress;
  }

  location @runtime_404_suppress {
    default_type application/json;
    return 404 '{"code":"NOT_FOUND","message":"请求的资源不存在，请确认本地 Runtime 版本与前端版本一致并重新部署。"}';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
