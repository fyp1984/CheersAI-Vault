[package]
name = "component-runtime"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/fyp1984/CheersAI-Vault.git"
homepage = "https://github.com/fyp1984/CheersAI-Vault"

[dependencies]
engine-core = { path = "../engine-core" }
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["process", "time", "io-util", "rt", "sync", "macros"] }
tempfile = "3"
