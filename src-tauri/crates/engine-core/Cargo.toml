[package]
name = "engine-core"
version = "0.1.0"
edition = "2021"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
hmac = "0.12"
once_cell = "1"
pbkdf2 = "0.12"
quick-xml = "0.31"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
zeroize = { version = "1", features = ["derive"] }
zip = "0.6"
calamine = "0.24"
lopdf = "0.32"
# PDF text extraction. Replaces pdf-extract 0.7, which panics (rather than
# returning Err) on Type0/CID composite fonts — see parse_pdf() for details.
parangi = "0.1"

[dev-dependencies]
serde_json = "1"
