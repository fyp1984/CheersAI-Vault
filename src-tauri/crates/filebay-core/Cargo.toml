[package]
name = "filebay-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/fyp1984/CheersAI-Vault.git"
homepage = "https://github.com/fyp1984/CheersAI-Vault"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "1"
reqwest = { version = "=0.11.27", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
