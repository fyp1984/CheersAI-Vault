[package]
name = "vault-runtime-api"
version = "0.1.0"
edition = "2021"

[dependencies]
bytes = "1"
cfb = "=0.7.3"
chrono = { version = "0.4", features = ["serde"] }
component-runtime = { path = "../../src-tauri/crates/component-runtime" }
csv = "=1.4.0"
engine-core = { path = "../../src-tauri/crates/engine-core" }
filebay-core = { path = "../../src-tauri/crates/filebay-core" }
futures-util = "0.3"
once_cell = "1"
sandbox-core = { path = "../../src-tauri/crates/sandbox-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
service-contracts = { path = "../../src-tauri/crates/service-contracts" }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
warp = "0.3"

[dev-dependencies]
sha2 = "0.10"

