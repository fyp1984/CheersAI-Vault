# CheersAI Vault — Nginx 站点模板（Linux 内网客户测试部署）
#
# 这是一个模板，不能直接使用：全部 <尖括号> 占位符必须由部署管理员替换为
# 真实值。默认只允许 loopback 访问——部署管理员必须显式加入客户网段
# 的 CIDR，本文件不预置、也绝不能改成 `allow all;` 或 `0.0.0.0/0`。
#
# 架构：
#   浏览器 / 企业内网系统
#           ↓
#   Nginx（本文件，唯一内网入口）
#     ├─ /          → 原 Vault 根前端 dist/（原样对应仓库根 vite.config.ts 构建产物）
#     └─ /api/      → 127.0.0.1:8787（vault-runtime-api，Runtime 只监听 loopback）
#
# 安装步骤（部署管理员在隔离 Linux 主机上执行）：
#   1. 在仓库根目录执行 `pnpm exec vite build`（或等效 CI 构建），产物在
#      仓库根 <REPO_CHECKOUT_PATH>/dist/。把该目录（或其副本）作为本文件
#      的 root，不要把整个仓库检出目录直接当 Web root。
#   2. 确认 Runtime 数据目录（VAULT_RUNTIME_DATA_DIR，含 SQLite/输入/产物/
#      映射文件）与本文件的 root 物理隔离，不在 Web root 之下、不可被
#      Nginx 静态文件服务访问到。
#   3. 把本文件拷贝到 /etc/nginx/sites-available/cheersai-vault.conf，替换
#      全部 <尖括号> 占位符，`ln -s` 到 sites-enabled（或按发行版惯例）。
#   4. `nginx -t` 验证语法，再 `systemctl reload nginx`（或 `nginx -s reload`）。
#
# 验证：从 §CIDR 之外的第二台主机 / 独立网络访问本 Nginx 监听地址应被拒绝
# 或超时；从白名单内主机访问应能看到原 Vault 页面且批量流程可用；任何主机
# 都不能直连 Runtime 的 127.0.0.1:8787（该端口不在任何网卡上监听，天然不
# 可被远程访问，Nginx 配置本身也不代理到该端口以外的任何本地服务）。

server {
    listen <NGINX_LISTEN_ADDRESS>:80;
    server_name <NGINX_SERVER_NAME>;

    # ---- 客户 CIDR 白名单（必须由部署管理员显式填写，禁止 allow all） ----
    # 每行一个客户网段，例如：
    #   allow 10.20.30.0/24;
    #   allow 10.20.40.5/32;
    # 部署前占位符必须替换为真实网段，否则除 loopback 外全部拒绝。
    allow 127.0.0.1;
    allow <CUSTOMER_CIDR_1>;
    # allow <CUSTOMER_CIDR_2>;
    deny all;

    # ---- 原 Vault 根前端静态资源 ----
    # root 必须指向构建产物目录，且该目录之外不得包含 Runtime 数据/日志/
    # SQLite/.cmap；不启用目录列表；SPA 路由回退到 index.html。
    root <VAULT_FRONTEND_DIST_PATH>;
    index index.html;
    autoindex off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（可选，不影响功能正确性）。
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---- Runtime API 反向代理 ----
    # 只代理到 Runtime 的固定 loopback 地址和端口；不得改成变量端口或
    # 代理任意本地路径；不返回 Runtime 之外的任何本地文件系统内容。
    location /api/ {
        proxy_pass http://127.0.0.1:8787/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 批量上传可能是较大的 multipart 请求；按需调整，但不要设为无限制。
        client_max_body_size 2200m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 显式拒绝任何试图访问 Runtime 数据/隐藏文件的请求路径，双重保险
    # （即使误配置把数据目录放进了 Web root，也不会被静态文件服务返回）。
    location ~ /\.(cmap|env|git) {
        deny all;
        return 404;
    }
}

# ---- 生产提示（本次客户测试版不启用，供后续演进参考） ----
# - 本模板不含 TLS/HTTPS 配置：这是一个隔离测试内网部署，如客户要求 HTTPS，
#   需另行提供证书并新增 `listen 443 ssl;` 配置块，不属于本次交付范围。
# - 本模板不含应用层鉴权（无 Basic Auth / OAuth / API Key）；CIDR 白名单是
#   本版本唯一的访问控制手段，见 docs/enterprise/DEPLOYMENT.md 的安全边界
#   说明。
